<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Message</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #111b21; color: #e9edef; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .chat-container { width: 100%; max-width: 420px; height: 100vh; background: #0b141a; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        @media (min-height: 700px) {
            .chat-container { height: 750px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid #222d34; }
        }
        
        /* 模仿聊天软件顶部导航栏 */
        .chat-header { background: #202c33; padding: 10px 15px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #222d34; z-index: 10; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .header-info h2 { font-size: 16px; color: #f1f1f2; font-weight: 500; }
        .header-info p { font-size: 12px; color: #00a884; }

        /* 聊天内容区 */
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: radial-gradient(#222d34 1px, transparent 1px); background-size: 20px 20px; }
        
        .bubble { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.4; position: relative; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .incoming { background: #202c33; align-self: flex-start; border-top-left-radius: 0; color: #e9edef; }
        .outgoing { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; color: #e9edef; }
        
        .timestamp { font-size: 10px; color: #8696a0; float: right; margin-left: 10px; margin-top: 4px; line-height: 12px; }

        /* 语音条样式 */
        .voice-msg { display: flex; align-items: center; gap: 10px; min-width: 150px; cursor: pointer; }
        .play-btn { width: 30px; height: 30px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }

        /* 底部互动操作区 */
        .chat-footer { background: #202c33; padding: 12px 15px; display: flex; flex-direction: column; gap: 10px; }
        .action-btn { background: #00a884; color: #fff; border: none; padding: 12px; border-radius: 24px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: block; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .typing-indicator { font-size: 12px; color: #8696a0; padding-left: 5px; height: 18px; }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- 顶部 -->
    <div class="chat-header">
        <img class="avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80" alt="Avatar">
        <div class="header-info">
            <h2 id="username">Jessica</h2>
            <p>在线 • 距离你 700m</p>
        </div>
    </div>

    <!-- 聊天气泡流 -->
    <div class="chat-body" id="chat-stream">
        <!-- 动态生成的聊天记录会插在这里 -->
    </div>

    <!-- 底部输入/互动区 -->
    <div class="chat-footer">
        <div class="typing-indicator" id="typing">Jessica 正在输入...</div>
        <!-- 🔴 把这里替换成你的 BeMob 追踪链接 🔴 -->
        <a href="https://YOUR_BEMOB_TRACKING_URL_HERE.com" class="action-btn" id="reply-btn" style="display: none;">点击回复并查看私密照片 ➔</a>
    </div>
</div>

<script>
    // 替换为你的 BeMob 追踪链接
    const BEMOB_URL = "https://YOUR_BEMOB_TRACKING_URL_HERE.com";
    document.getElementById('reply-btn').href = BEMOB_URL;

    // 模拟真实聊天的动态剧本
    const chatSteps = [
        { type: 'incoming', text: '嗨... 你刚才是不是在附近看我资料？ 👀', delay: 1000 },
        { type: 'incoming', text: '我看你离我超级近，就顺手点进来了。', delay: 2500 },
        { type: 'incoming', text: '一个人在家好无聊，你今晚有空过来坐坐吗？ 🍷', delay: 4500 },
        { type: 'voice', text: '发送了一条语音消息 (0:14)', delay: 6500 },
        { type: 'incoming', text: '这是我刚才拍的，不过只能看一眼哦... 👇', delay: 8500 }
    ];

    const chatStream = document.getElementById('chat-stream');
    const typingIndicator = document.getElementById('typing');
    const replyBtn = document.getElementById('reply-btn');

    function getTimeString() {
        const d = new Date();
        return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
    }

    let currentStep = 0;

    function playChat() {
        if (currentStep < chatSteps.length) {
            typingIndicator.style.display = 'block';
            let step = chatSteps[currentStep];

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                let bubble = document.createElement('div');
                bubble.className = `bubble incoming`;

                if (step.type === 'voice') {
                    bubble.innerHTML = `
                        <div class="voice-msg">
                            <div class="play-btn">▶</div>
                            <span>语音消息 [0:14]</span>
                        </div>
                        <span class="timestamp">${getTimeString()}</span>
                    `;
                } else {
                    bubble.innerHTML = `${step.text} <span class="timestamp">${getTimeString()}</span>`;
                }

                chatStream.appendChild(bubble);
                chatStream.scrollTop = chatStream.scrollHeight;

                currentStep++;
                playChat();
            }, step.delay - (currentStep === 0 ? 0 : chatSteps[currentStep - 1].delay));
        } else {
            // 剧本走完，显示强转化按钮
            setTimeout(() => {
                typingIndicator.style.display = 'none';
                replyBtn.style.display = 'block';
                if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
            }, 1000);
        }
    }

    // 页面加载后触发震动并开始播放聊天剧本
    window.onload = function() {
        if ("vibrate" in navigator) navigator.vibrate(100);
        setTimeout(playChat, 500);
    };
</script>
</body>
</html>
