<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Secure Stream</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .container { width: 100%; max-width: 410px; height: 100vh; background: #050508; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        @media (min-height: 650px) {
            .container { height: 720px; border-radius: 20px; border: 1px solid #1a1a24; box-shadow: 0 25px 50px rgba(0,0,0,0.9); }
        }

        /* 顶部逼真直播/偷窥标识 */
        .top-status { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 30; }
        .live-badge { background: rgba(239, 68, 68, 0.9); color: #fff; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 5px; box-shadow: 0 0 10px rgba(239,68,68,0.5); }
        .live-dot { width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        .geo-tag { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(6px); color: #cbd5e1; font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }

        /* 猫眼/门缝暗角视窗（核心视觉欺骗） */
        .viewport-frame { position: relative; width: 100%; height: 62%; background: #000; overflow: hidden; }
        .viewport-frame img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8) contrast(1.1); animation: subtleZoom 10s ease-out infinite alternate; }
        
        @keyframes subtleZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* 四周极度压抑的猫眼暗角阴影 */
        .vignette-overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 85%, #000 100%); pointer-events: none; z-index: 10; }

        /* 底部操作与诱惑互动区 */
        .action-panel { flex: 1; background: linear-gradient(to top, #08080c 60%, rgba(8,8,12,0.9) 90%, transparent 100%); padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; z-index: 20; position: relative; }
        
        .alert-box { font-size: 13px; color: #94a3b8; margin-bottom: 12px; line-height: 1.4; text-align: center; }
        .alert-box strong { color: #f43f5e; }

        /* 暴力转化按钮（强呼吸动效） */
        .btn-action { background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); color: #fff; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: bold; text-decoration: none; text-align: center; display: block; box-shadow: 0 4px 20px rgba(244,63,94,0.4); animation: breatheBtn 1.5s infinite; }
        @keyframes breatheBtn { 0%, 100% { transform: scale(1); box-shadow: 0 4px 20px rgba(244,63,94,0.4); } 50% { transform: scale(1.02); box-shadow: 0 6px 25px rgba(244,63,94,0.7); } }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 顶部状态 -->
    <div class="top-status">
        <div class="live-badge"><div class="live-dot"></div> 实时私密直连</div>
        <div class="geo-tag" id="geo-box">定位中...</div>
    </div>

    <!-- 2. 中间：猫眼/门缝暗角视窗 -->
    <div class="viewport-frame">
        <div class="vignette-overlay"></div>
        <!-- 这里的图片可以随时换成你手里转化率最高的高清擦边/素人动图或WebP -->
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=80" alt="Stream Preview">
    </div>

    <!-- 3. 底部文案与转化区 -->
    <div class="action-panel">
        <div class="alert-box" id="dynamic-text">
            系统已检测到您在 <strong>附近区域</strong> 的信号，对方房门未锁，正在等待进入...
        </div>

        <!-- 🔴 替换为你的 BeMob 追踪链接 🔴 -->
        <a href="https://YOUR_BEMOB_TRACKING_URL_HERE.com" class="btn-action" id="click-target">
            推门进入并建立私密连线 ➔
        </a>
    </div>
</div>

<script>
    // 替换为你的 BeMob Tracking URL
    const BEMOB_URL = "https://YOUR_BEMOB_TRACKING_URL_HERE.com";
    document.getElementById('click-target').href = BEMOB_URL;

    // 页面加载触发微震动并自动获取定位填充
    window.onload = function() {
        if ("vibrate" in navigator) navigator.vibrate(200);

        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                const city = data.city || "本地";
                const region = data.region || "";
                
                // 动态注入真实地名，极大地增强沉浸感
                document.getElementById('geo-box').innerText = `${region} · ${city}`;
                document.getElementById('dynamic-text').innerHTML = `系统已检测到您在 <strong>[${city}]</strong> 的物理距离不足 500m，对方房门未锁，点击立即加入...`;
            })
            .catch(() => {
                document.getElementById('geo-box').innerText = "附近 500m";
                document.getElementById('dynamic-text').innerHTML = `系统已检测到您在 <strong>附近区域</strong> 的物理距离不足 500m，对方房门未锁，点击立即加入...`;
            });
    };
</script>
</body>
</html>
