<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Door View</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .viewport { width: 100%; max-width: 410px; height: 100vh; background: #08080c; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        @media (min-height: 650px) {
            .viewport { height: 720px; border-radius: 20px; border: 1px solid #1f2937; }
        }

        /* 顶部偷窥提示 */
        .spy-header { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(8px); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 20; position: absolute; top: 0; left: 0; right: 0; }
        .live-tag { background: #ef4444; color: #fff; font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 10px; display: flex; align-items: center; gap: 4px; }
        .live-dot { width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* 3D 第一视角推门舞台 */
        .door-scene { position: relative; width: 100%; height: 65%; overflow: hidden; perspective: 1000px; background: #000; }
        
        /* 房间内部视觉（随着门打开逐渐推近放大） */
        .room-inner { position: absolute; inset: 0; width: 100%; height: 100%; background-size: cover; background-position: center; animation: zoomInCamera 8s ease-out forwards; filter: brightness(0.85); }
        .room-inner img { width: 100%; height: 100%; object-fit: cover; filter: blur(4px); } /* 轻微高斯模糊制造窥探隐秘感 */
        
        @keyframes zoomInCamera {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); } /* 缓缓推近视觉 */
        }

        /* 门缝遮罩动画（从两边缓缓拉开，营造从门缝探头进去的镜头感） */
        .door-leaf-left, .door-leaf-right { position: absolute; top: 0; bottom: 0; width: 50%; background: #050508; z-index: 10; transition: transform 2.5s cubic-bezier(0.25, 1, 0.5, 1); }
        .door-leaf-left { left: 0; border-right: 2px solid #111; transform-origin: left; }
        .door-leaf-right { right: 0; border-left: 2px solid #111; transform-origin: right; }
        
        /* 门打开时的动画状态 */
        .door-scene.open .door-leaf-left { transform: translateX(-88%); }
        .door-scene.open .door-leaf-right { transform: translateX(88%); }

        /* 窥探锁与提示 */
        .spy-overlay { position: absolute; inset: 0; z-index: 15; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.95) 10%, transparent 70%); }
        
        .chat-bubble { background: rgba(31, 41, 55, 0.9); border-left: 3px solid #f43f5e; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.4; color: #f3f4f6; margin-bottom: 12px; }
        .chat-bubble span { color: #f43f5e; font-weight: bold; }

        /* 强转化按钮 */
        .btn-unlock { background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); color: #fff; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; text-decoration: none; text-align: center; display: block; box-shadow: 0 4px 20px rgba(244,63,94,0.4); animation: breathe 1.5s infinite; }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    </style>
</head>
<body>

<div class="viewport">
    <!-- 顶部状态 -->
    <div class="spy-header">
        <div style="font-size: 13px; font-weight: bold; color: #e5e7eb;" id="geo-title">隔壁房间 (距您 50m)</div>
        <div class="live-tag"><div class="live-dot"></div> 实时连线中</div>
    </div>

    <!-- 3D 门缝镜头场景 -->
    <div class="door-scene" id="doorScene">
        <!-- 门缝左遮罩 -->
        <div class="door-leaf-left"></div>
        <!-- 门缝右遮罩 -->
        <div class="door-leaf-right"></div>
        
        <!-- 房间内部：第一视角背景图/GIF -->
        <div class="room-inner">
            <!-- 建议替换为具有极强动态隐秘感或擦边自拍视角的 WebP/GIF 动态图 -->
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=80" alt="Inside Room">
        </div>

        <!-- 偷窥界面遮罩与提示 -->
        <div class="spy-overlay">
            <div class="chat-bubble" id="spy-text">
                “房门没锁... 我在床上等你，进门记得轻点...” <span>[偷窥视角已锁定]</span>
            </div>
            
            <!-- 🔴 替换为你的 BeMob 追踪链接 🔴 -->
            <a href="https://YOUR_BEMOB_TRACKING_URL_HERE.com" class="btn-unlock" id="click-target">
                推门进入私密房间 ➔
            </a>
        </div>
    </div>
</div>

<script>
    const BEMOB_URL = "https://YOUR_BEMOB_TRACKING_URL_HERE.com";
    document.getElementById('click-target').href = BEMOB_URL;

    window.onload = function() {
        // 1. 触发手机震动（模拟手握门把手的感觉）
        if ("vibrate" in navigator) navigator.vibrate([150, 80, 150]);

        // 2. 延迟 0.6 秒自动执行“缓推房门”动画
        setTimeout(() => {
            document.getElementById('doorScene').classList.add('open');
        }, 600);

        // 3. 动态抓取城市拼入
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                const city = data.city || "隔壁";
                document.getElementById('geo-title').innerText = `[${city}] 隔壁房间 · 门未锁`;
            })
            .catch(() => {});
    };
</script>
</body>
</html>
