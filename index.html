<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Chat - Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .phone-frame { background: #121824; border-radius: 24px; border: 2px solid #2a3447; width: 100%; max-width: 380px; padding: 15px; box-shadow: 0 15px 35px rgba(244,63,94,0.15); position: relative; overflow: hidden; }
        
        /* 顶部通知栏 */
        .top-bar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid #1f293d; margin-bottom: 15px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar-wrap { position: relative; width: 44px; height: 44px; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #f43f5e; }
        .status-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: #22c55e; border: 2px solid #121824; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .name-tag h3 { font-size: 15px; font-weight: bold; color: #fff; }
        .name-tag p { font-size: 11px; color: #f43f5e; }

        /* 视窗背景（大图诱惑区） */
        .media-preview { position: relative; width: 100%; height: 260px; border-radius: 14px; overflow: hidden; margin-bottom: 15px; background: #000; }
        .media-preview img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.9); }
        .blur-overlay { position: absolute; inset: 0; backdrop-filter: blur(12px); background: rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .lock-icon { font-size: 32px; margin-bottom: 8px; }

        /* 聊天气泡区 */
        .chat-bubble { background: #1e293b; padding: 12px 15px; border-radius: 12px; font-size: 14px; line-height: 1.4; margin-bottom: 15px; border-left: 3px solid #f43f5e; }
        .chat-bubble span { color: #f43f5e; font-weight: bold; }

        /* 互动按钮 */
        .btn { background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); color: #fff; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; text-decoration: none; display: block; text-align: center; box-shadow: 0 4px 15px rgba(244,63,94,0.4); animation: pulse-btn 1.5s infinite; }
        @keyframes pulse-btn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

        .timer-box { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 10px; }
        .timer-box span { color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- 顶部：伪装真实本地用户 -->
    <div class="top-bar">
        <div class="user-info">
            <div class="avatar-wrap">
                <!-- 替换为更具视觉冲击力的真人素人头像 -->
                <img class="avatar" src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150&auto=format&fit=crop&q=80" alt="User">
                <div class="status-dot"></div>
            </div>
            <div class="name-tag">
                <h3 id="local-user">Natasha (距离 800m)</h3>
                <p>刚刚在线 • 正在发来语音</p>
            </div>
        </div>
        <div style="font-size: 18px;">🔥</div>
    </div>

    <!-- 中间：动态高斯模糊诱惑图 (视觉抓眼球) -->
    <div class="media-preview">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=80" alt="Preview">
        <div class="blur-overlay">
            <div class="lock-icon">🔒</div>
            <p style="font-size: 13px; font-weight: bold; margin-bottom: 4px;">私密视频与照片已锁定</p>
            <p style="font-size: 11px; color: #cbd5e1;">完成年龄与地理位置校验即可解锁全部内容</p>
        </div>
    </div>

    <!-- 底部：聊天气泡文案 -->
    <div class="chat-bubble">
        “我在家洗完澡了，今晚一个人好无聊... 离你只有不到 1 公里，要不要过来陪我？ <span>[点击查看私密聊天]</span>”
    </div>

    <!-- 强转化按钮（直连 BeMob 链接） -->
    <!-- 🔴 记得把下方的链接换成你的 BeMob 追踪链接 🔴 -->
    <a href="https://YOUR_BEMOB_TRACKING_URL_HERE.com" class="btn">解锁与她私密对话 ➔</a>

    <div class="timer-box">
        ⚠️ 匹配名额仅为为您保留：<span id="countdown">02:59</span>
    </div>
</div>

<script>
    // 手机震动触发
    window.onload = function() {
        if ("vibrate" in navigator) {
            navigator.vibrate([300, 100, 300]);
        }
        startTimer(179);
    };

    // 倒计时逻辑
    function startTimer(duration) {
        let timer = duration, minutes, seconds;
        let display = document.getElementById('countdown');
        let countdownInterval = setInterval(function () {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            display.textContent = minutes + ":" + seconds;
            if (--timer < 0) {
                clearInterval(countdownInterval);
                display.textContent = "00:00 (已失效)";
            }
        }, 1000);
    }
</script>
</body>
</html>
