<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Radar Active</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b141a; color: #e9edef; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 410px; height: 100vh; background: #111b21; display: flex; flex-direction: column; position: relative; }
        @media (min-height: 650px) {
            .app-container { height: 720px; border-radius: 20px; border: 1px solid #222d34; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        }

        /* 顶部黑帽私信头栏 */
        .app-header { background: #202c33; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #222d34; }
        .avatar-box { position: relative; width: 44px; height: 44px; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #00a884; }
        .online-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: #00a884; border: 2px solid #202c33; border-radius: 50%; }
        .header-text h3 { font-size: 15px; font-weight: 600; color: #e9edef; }
        .header-text p { font-size: 12px; color: #00a884; }

        /* 雷达扫描诱惑区 */
        .radar-box { position: relative; width: 100%; height: 200px; background: #0b141a; display: flex; justify-content: center; align-items: center; overflow: hidden; border-bottom: 1px solid #222d34; }
        .radar-sweep { position: absolute; width: 300px; height: 300px; background: conic-gradient(from 0deg, rgba(0, 168, 132, 0.4) 0deg, transparent 60deg); border-radius: 50%; animation: spin 2.5s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .radar-circle { position: absolute; border: 1px solid rgba(0, 168, 132, 0.2); border-radius: 50%; }
        .radar-status { position: absolute; bottom: 10px; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 12px; font-size: 11px; color: #8696a0; }

        /* 模拟消息流 */
        .chat-body { flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .msg-bubble { background: #202c33; padding: 12px; border-radius: 8px; border-top-left-radius: 0; max-width: 85%; font-size: 14px; position: relative; animation: popIn 0.3s ease; }
        @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 毛玻璃模糊图（刺激窥探欲） */
        .blur-media { position: relative; margin-top: 8px; border-radius: 6px; overflow: hidden; height: 140px; }
        .blur-media img { width: 100%; height: 100%; object-fit: cover; filter: blur(14px); }
        .lock-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; color: #fff; }

        /* 强转化按钮 */
        .action-area { padding: 15px; background: #202c33; display: flex; flex-direction: column; gap: 8px; }
        .btn-unlock { background: #00a884; color: #111b21; border: none; padding: 14px; border-radius: 24px; font-size: 16px; font-weight: bold; text-decoration: none; text-align: center; display: block; box-shadow: 0 4px 12px rgba(0,168,132,0.3); animation: pulseBtn 1.5s infinite; }
        @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 1. 高仿社交软件头部 -->
    <div class="app-header">
        <div class="avatar-box">
            <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Local User">
            <div class="online-dot"></div>
        </div>
        <div class="header-text">
            <h3 id="target-name">Elena (距离约 600m)</h3>
            <p id="sub-status">🟢 正在等待您的回复...</p>
        </div>
    </div>

    <!-- 2. 动态雷达指示（营造真实匹配感） -->
    <div class="radar-box">
        <div class="radar-circle" style="width: 80px; height: 80px;"></div>
        <div class="radar-circle" style="width: 160px; height: 160px;"></div>
        <div class="radar-sweep"></div>
        <div class="radar-status" id="radar-text">🛰️ 雷达定位中：锁定您当前区域的私信</div>
    </div>

    <!-- 3. 私密对话流 -->
    <div class="chat-body">
        <div class="msg-bubble">
            “你也在附近吗？我看到系统提示你的位置了... 刚好今晚一个人，要不要交换一下私密照片？”
            <div class="blur-media">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=80" alt="Private Preview">
                <div class="lock-overlay">
                    <span style="font-size: 20px;">🔒</span>
                    <span>点击下方按钮解锁高清私照</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. 终极跳转入口 -->
    <div class="action-area">
        <!-- 🔴 记住把下面的链接替换成你真实的 BeMob 追踪链接 🔴 -->
        <a href="https://YOUR_BEMOB_TRACKING_URL_HERE.com" class="btn-unlock" id="click-target">
            接受私信并开启私密对话 ➔
        </a>
    </div>
</div>

<script>
    // 替换为你的 BeMob Tracking URL
    const BEMOB_URL = "https://YOUR_BEMOB_TRACKING_URL_HERE.com";
    document.getElementById('click-target').href = BEMOB_URL;

    // 自动抓取 IP 伪装真实区域
    window.onload = function() {
        if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
        
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                const city = data.city || "您所在区域";
                document.getElementById('radar-text').innerText = `🛰️ 已锁定 [${city}] 1.5km 范围内的私密会话`;
            })
            .catch(() => {
                document.getElementById('radar-text').innerText = `🛰️ 已锁定您附近 1.5km 范围内的私密会话`;
            });
    };
</script>
</body>
</html>
